---
# A publikalas MINDIG szukitessel jar. Enelkul a Jupyter - ami teljes koru
# kodfuttatas az eles adatbazis elereseval - kikerulne a nyilt internetre,
# egyetlen tokennel vedve.
#
# Ezert ez kemeny leallas, nem figyelmeztetes: aki publikalni akar, annak meg
# kell mondania, KINEK. A dontest nem hozzuk meg helyette.
- name: A publikalashoz IP-lista kell
  ansible.builtin.fail:
    msg: >-
      publish_web_ui: true, de az allowed_ips ures. Ez a negy admin feluletet
      (Airflow, Grafana, Prometheus, Jupyter) a teljes internet fele nyitna ki.
      Add meg a group_vars-ban, honnan szabad elerni oket - vagy hagyd a
      publish_web_ui-t false-on, es hasznalj SSH-alagutat.
  when: publish_web_ui and allowed_ips | length == 0
  tags: [stack]

- name: Titkok elokeszitese
  ansible.builtin.include_tasks: secrets.yml
  tags: [stack]

- name: Konyvtarak
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_users | first }}"
    group: "{{ docker_users | first }}"
    mode: "0755"
  loop:
    - "{{ stack_dir }}"
    - "{{ stack_dir }}/initdb"
    - "{{ app_dir }}"
    # A DAG-ok a modellkodbol jonnek, amit git pull frissit. Az InitInfra csak
    # a konyvtarat hozza letre - a tartalom az ugyfele.
    - "{{ app_dir }}/dags"
  tags: [stack]

# Az API kodja NEM az InitInfra resze: az ugyfel repojabol kerul a helyere, a
# telepites UTAN (ROADMAP 9. fazis). Amig nincs ott, az "api" szolgaltatast el
# sem inditjuk.
#
# Miert nem: kod nelkul az uvicorn "ModuleNotFoundError"-ral elszall, a
# "restart: unless-stopped" pedig orokke ujrainditja. Egy vegtelenul
# ujrainduló kontener elrejti az igazi hibakat - a "minden szolgaltatas fut"
# ellenorzes pont akkor valna hasznalhatatlanna, amikor a legtobbet erne.
#
# A "dags" konyvtart mi magunk hozzuk letre, ezert az nem szamit kodnak.
- name: Van-e mar ugyfelkod a {{ app_dir }}-ban
  ansible.builtin.find:
    paths: "{{ app_dir }}"
    file_type: any
    excludes: ["dags"]
  register: app_tartalom
  changed_when: false
  tags: [stack]

- name: Az api szolgaltatas sorsa
  ansible.builtin.set_fact:
    api_indithato: "{{ api_enabled and app_tartalom.matched | int > 0 }}"
  tags: [stack]

- name: Az api szolgaltatas most kimarad
  ansible.builtin.debug:
    msg: >-
      A(z) {{ app_dir }} meg ures, ezert az "api" szolgaltatas kimarad a
      stackbol. Tedd oda az ugyfel kodjat, majd futtasd ujra a "make dev"-et.
  when: api_enabled and not api_indithato
  tags: [stack]

# Ezeket az Airflow konteneret futtato UID birtokolja, NEM a docker felhasznalo.
# Ha a docker felhasznalonak adnank, chown-pingpong lenne belole: az Ansible
# atirna 1000-re, az airflow-init vissza 50000-re, es minden futas "changed"
# lenne - vegtelen ciklusban, sosem idempotensen.
- name: Az Airflow altal irt konyvtarak
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ airflow_uid }}"
    group: "0"
    mode: "0755"
  loop:
    - "{{ stack_dir }}/config"
    - "{{ stack_dir }}/plugins"
  tags: [stack]

# --- Az app image ----------------------------------------------------------
- name: Az app image konyvtara
  ansible.builtin.file:
    path: "{{ stack_dir }}/app"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [stack, app]

- name: A Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ stack_dir }}/app/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  notify: app image ujraepitese
  tags: [stack, app]

- name: A requirements.txt
  ansible.builtin.copy:
    src: requirements.txt
    dest: "{{ stack_dir }}/app/requirements.txt"
    owner: root
    group: root
    mode: "0644"
  notify: app image ujraepitese
  tags: [stack, app]

# Ket lepesben: eloszor megnezzuk, letezik-e mar. Igy az elso futas megepiti,
# a tobbi pedig NEM ir hamis "changed"-et. A forrasfajlok valtozasat a fenti
# ket task handlere kezeli.
- name: Letezik-e mar az app image
  ansible.builtin.command: docker image inspect {{ app_image }}
  register: app_image_van
  failed_when: false
  changed_when: false
  tags: [stack, app]

# Ugyanaz a megfontolas, mint a "A stack fut" tasknal: a build tobb szaz
# megabajtot tolt le (az Airflow alapkep es a torch), es a Docker retegenkent
# gyorsitotaraz - egy ujraprobalkozas az utolso sikeres retegtol folytatja.
- name: Az app image megepitese
  ansible.builtin.command:
    cmd: docker build -t {{ app_image }} .
    chdir: "{{ stack_dir }}/app"
  register: app_build
  until: app_build.rc == 0
  retries: 3
  delay: 15
  when: app_image_van.rc != 0
  tags: [stack, app]

# --- Observability konfiguraciok --------------------------------------------
- name: A megfigyeles konyvtarai
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ stack_dir }}/prometheus"
    - "{{ stack_dir }}/grafana/provisioning/datasources"
  tags: [stack, obs]

- name: A megfigyeles konfigfajljai
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: prometheus.yml,      dest: "{{ stack_dir }}/prometheus/prometheus.yml" }
    # 19 szabaly. Az Airflow a dag_id-t es a task_id-t a metrika NEVEBE agyazza;
    # mapping nelkul minden DAG/task/allapot kombinaciora kulon metrikanev
    # keletkezne, ami Prometheusban kezelhetetlen.
    - { src: statsd-mapping.yml,  dest: "{{ stack_dir }}/prometheus/statsd-mapping.yml" }
    - { src: grafana/datasource-prometheus.yml,
        dest: "{{ stack_dir }}/grafana/provisioning/datasources/prometheus.yml" }
  notify: stack ujrainditasa
  tags: [stack, obs]

# A .env a titkokat tartalmazza, ezert 0600 es root tulajdon.
- name: A .env kiirasa
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stack_dir }}/.env"
    owner: root
    # A csoport a "docker", 0640-nel. A docker csoport tagsaga amugy is
    # root-egyenerteku (barki, aki tagja, be tud mountolni / -t egy kontenerbe),
    # tehat ez nem gyengit semmit - viszont enelkul a "docker compose ps" is
    # csak sudo-val menne, mert a Compose olvassa a .env-et.
    group: docker
    mode: "0640"
  notify: stack ujrainditasa
  tags: [stack]

- name: A compose fajl kiirasa
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: stack ujrainditasa
  tags: [stack]

# A validate: kapcsolo itt NEM jo: az Ansible egy ideiglenes fajlon futtatna a
# parancsot, ahol nincs .env - a valtozok feloldatlanul maradnanak, es a
# validacio hamisan elbukna. Ezert kulon taskban ellenorzunk, a helyen.
- name: A compose fajl ervenyessegenek ellenorzese
  ansible.builtin.command:
    cmd: docker compose config -q
    chdir: "{{ stack_dir }}"
  changed_when: false
  tags: [stack]

- name: Az adatbazis-init szkript
  ansible.builtin.copy:
    src: initdb-10-app-db.sh
    dest: "{{ stack_dir }}/initdb/10-app-db.sh"
    owner: root
    group: root
    mode: "0755"
  notify: stack ujrainditasa
  tags: [stack]

# Ez a task GONDOSKODIK rola, hogy a stack fusson, de sosem ir "changed"-et:
# a valtozast a fenti sablonok handlerei jelzik. Igy a masodik futas tiszta.
#
# Az ujraprobalkozas NEM ovatoskodas: egy nullarol-probanal a 229. megabajtnal
# elszakadt a kapcsolat a registry fele ("connection reset by peer"), es az
# egesz telepites elhasalt. A Docker a mar letoltott retegeket megtartja, tehat
# az ujraprobalkozas onnan folytatja, ahol abbahagyta - nem kezdi elolrol.
#
# Egy telepitonek, ami tobb gigabajtnyi image-et tolt le, szamitania kell arra,
# hogy a halozat elszakad kozben. Ez nem kivetel, hanem a normalis mukodes
# resze.
- name: A stack fut
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ stack_dir }}"
  register: stack_all
  until: stack_all.rc == 0
  retries: 3
  delay: 15
  changed_when: false
  tags: [stack]

- name: Varakozas a Postgresre
  ansible.builtin.command:
    cmd: docker compose exec -T postgres pg_isready -U {{ pg_airflow_user }} -d {{ pg_airflow_db }}
    chdir: "{{ stack_dir }}"
  register: pg_kesz
  until: pg_kesz.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  tags: [stack]

# A "docker compose up -d" visszaterese csak annyit jelent, hogy a kontenerek
# ELINDULTAK - nem azt, hogy mukodnek. Az Airflow apiserver ilyenkor meg
# lefuttatja a db migraciot es az elso utemezoi kort: friss gepen 1-2 perc.
#
# Enelkul a bootstrap zaro ellenorzese PIROSAT IR EGY TOKELETESEN JO GEPRE -
# nullarol-probanal pontosan ez tortent. A playbooknak azt kell jelentenie,
# hogy a stack MUKODIK, nem azt, hogy a kontenereket letrehoztuk.
#
# Mind a negy komponenst megvarjuk: az apiserver akkor is valaszol, amikor az
# utemezo meg nem all - ilyenkor a valasz "unhealthy"-t tartalmaz.
- name: Varakozas az Airflow-ra
  ansible.builtin.command:
    cmd: curl -sf http://127.0.0.1:{{ airflow_web_port }}/api/v2/monitor/health
  register: airflow_kesz
  until: >-
    airflow_kesz.rc == 0 and
    (airflow_kesz.stdout | regex_findall('"status":"healthy"') | length) == 4
  retries: 36
  delay: 5
  changed_when: false
  tags: [stack]
