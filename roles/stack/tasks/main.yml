---
- name: Titkok elokeszitese
  ansible.builtin.include_tasks: secrets.yml
  tags: [stack]

- name: Konyvtarak
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ docker_users | first }}"
    group: "{{ docker_users | first }}"
    mode: "0755"
  loop:
    - "{{ stack_dir }}"
    - "{{ stack_dir }}/initdb"
    - "{{ stack_dir }}/config"
    - "{{ stack_dir }}/plugins"
    - "{{ app_dir }}"
    # A DAG-ok a modellkodbol jonnek, amit git pull frissit. Az InitInfra csak
    # a konyvtarat hozza letre - a tartalom az ugyfele.
    - "{{ app_dir }}/dags"
  tags: [stack]

# --- Az app image ----------------------------------------------------------
- name: Az app image konyvtara
  ansible.builtin.file:
    path: "{{ stack_dir }}/app"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [stack, app]

- name: A Dockerfile
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ stack_dir }}/app/Dockerfile"
    owner: root
    group: root
    mode: "0644"
  notify: app image ujraepitese
  tags: [stack, app]

- name: A requirements.txt
  ansible.builtin.copy:
    src: requirements.txt
    dest: "{{ stack_dir }}/app/requirements.txt"
    owner: root
    group: root
    mode: "0644"
  notify: app image ujraepitese
  tags: [stack, app]

# Ket lepesben: eloszor megnezzuk, letezik-e mar. Igy az elso futas megepiti,
# a tobbi pedig NEM ir hamis "changed"-et. A forrasfajlok valtozasat a fenti
# ket task handlere kezeli.
- name: Letezik-e mar az app image
  ansible.builtin.command: docker image inspect {{ app_image }}
  register: app_image_van
  failed_when: false
  changed_when: false
  tags: [stack, app]

- name: Az app image megepitese
  ansible.builtin.command:
    cmd: docker build -t {{ app_image }} .
    chdir: "{{ stack_dir }}/app"
  when: app_image_van.rc != 0
  tags: [stack, app]

# A .env a titkokat tartalmazza, ezert 0600 es root tulajdon.
- name: A .env kiirasa
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stack_dir }}/.env"
    owner: root
    # A csoport a "docker", 0640-nel. A docker csoport tagsaga amugy is
    # root-egyenerteku (barki, aki tagja, be tud mountolni / -t egy kontenerbe),
    # tehat ez nem gyengit semmit - viszont enelkul a "docker compose ps" is
    # csak sudo-val menne, mert a Compose olvassa a .env-et.
    group: docker
    mode: "0640"
  notify: stack ujrainditasa
  tags: [stack]

- name: A compose fajl kiirasa
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: stack ujrainditasa
  tags: [stack]

# A validate: kapcsolo itt NEM jo: az Ansible egy ideiglenes fajlon futtatna a
# parancsot, ahol nincs .env - a valtozok feloldatlanul maradnanak, es a
# validacio hamisan elbukna. Ezert kulon taskban ellenorzunk, a helyen.
- name: A compose fajl ervenyessegenek ellenorzese
  ansible.builtin.command:
    cmd: docker compose config -q
    chdir: "{{ stack_dir }}"
  changed_when: false
  tags: [stack]

- name: Az adatbazis-init szkript
  ansible.builtin.copy:
    src: initdb-10-app-db.sh
    dest: "{{ stack_dir }}/initdb/10-app-db.sh"
    owner: root
    group: root
    mode: "0755"
  notify: stack ujrainditasa
  tags: [stack]

# Ez a task GONDOSKODIK rola, hogy a stack fusson, de sosem ir "changed"-et:
# a valtozast a fenti sablonok handlerei jelzik. Igy a masodik futas tiszta.
- name: A stack fut
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ stack_dir }}"
  changed_when: false
  tags: [stack]

- name: Varakozas a Postgresre
  ansible.builtin.command:
    cmd: docker compose exec -T postgres pg_isready -U {{ pg_airflow_user }} -d {{ pg_airflow_db }}
    chdir: "{{ stack_dir }}"
  register: pg_kesz
  until: pg_kesz.rc == 0
  retries: 30
  delay: 5
  changed_when: false
  tags: [stack]
