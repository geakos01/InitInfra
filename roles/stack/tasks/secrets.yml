---
# A titkok a GEPEN keletkeznek, es sosem kerulnek a repoba.
#
# Az idempotencia kulcsa: ha minden futasnal ujragenerálnank a jelszavakat, a
# mar letezo adatbazis elerhetetlenne valna. Az ansible.builtin.password lookup
# pontosan ezt oldja meg: ha a megadott fajl letezik, VISSZAOLVASSA belole a
# jelszot; ha nem, general egyet es kiirja.
#
# (Az elso valtozat a .env visszaolvasasaval probalkozott Jinja-szuroken
# keresztul. Nem mukodott: a YAML behajtogatott blokkjaban a '\n' nem ujsor,
# hanem ket karakter, ezert a split nem darabolt semmit - es a jelszavak
# minden futasnal ujra keletkeztek.)
#
# FIGYELEM: a lookup a VEZERLO gepen fut. Pull modellben ez ugyanaz a gep,
# de NEM root-kent, hanem az ansible-t futtato felhasznalokent - ezert kell a
# konyvtarat elore letrehozni, az o tulajdonaban.

- name: A titkok konyvtara
  ansible.builtin.file:
    path: "{{ stack_dir }}/.secrets"
    state: directory
    owner: "{{ docker_users | first }}"
    group: "{{ docker_users | first }}"
    mode: "0700"

# Hex, mert a base64 "/", "+" es "=" karakterei elszallnanak a psql
# string-literaljaban es a compose ${...} interpolaciojaban is.
- name: Jelszavak eloallitasa vagy visszaolvasasa
  ansible.builtin.set_fact:
    titkok:
      POSTGRES_AIRFLOW_PASSWORD: >-
        {{ lookup('ansible.builtin.password',
                  stack_dir ~ '/.secrets/pg_airflow', length=48, chars=['hexdigits']) }}
      POSTGRES_APP_PASSWORD: >-
        {{ lookup('ansible.builtin.password',
                  stack_dir ~ '/.secrets/pg_app', length=48, chars=['hexdigits']) }}
  no_log: true
