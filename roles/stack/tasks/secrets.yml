---
# A titkok a GEPEN keletkeznek, es SOHA nem kerulnek a repoba.
#
# A kihivas az idempotencia: ha minden futasnal ujrageneralnank a jelszavakat,
# a mar letezo adatbazis elerhetetlenne valna. Ezert:
#   1. ha a .env mar letezik, beolvassuk es a MEGLEVO ertekeket hasznaljuk
#   2. csak a hianyzokat generaljuk
#
# Igy a masodik futas nem valtoztat semmit - ez a fazis kesz-kriteriuma.

- name: A meglevo .env letezik-e
  ansible.builtin.stat:
    path: "{{ stack_dir }}/.env"
  register: env_stat

- name: A meglevo .env beolvasasa
  ansible.builtin.slurp:
    src: "{{ stack_dir }}/.env"
  register: env_raw
  when: env_stat.stat.exists

# A .env sorait kulcs-ertek szotarra bontjuk. A megjegyzeseket es az ures
# sorokat kihagyjuk, az ertekrol lehuzzuk az esetleges idezojeleket.
- name: A meglevo ertekek szotarra bontasa
  ansible.builtin.set_fact:
    meglevo: >-
      {{
        dict(
          (env_raw.content | b64decode).split('\n')
          | select('match', '^[A-Z_]+=')
          | map('regex_replace', '^([A-Z_]+)=(.*)$', '\1|\2')
          | map('split', '|')
          | map('list')
        ) | default({}, true)
      }}
  when: env_stat.stat.exists

- name: Ures szotar, ha meg nincs .env
  ansible.builtin.set_fact:
    meglevo: {}
  when: not env_stat.stat.exists

# A hex azert kell, mert a base64 "/", "+" es "=" karakterei elszallnak a psql
# string-literaljaban es a compose ${...} interpolaciojaban is.
- name: Hianyzo titkok generalasa
  ansible.builtin.set_fact:
    titkok: >-
      {{
        {
          'POSTGRES_AIRFLOW_PASSWORD': meglevo.POSTGRES_AIRFLOW_PASSWORD
            | default(lookup('ansible.builtin.password', '/dev/null', length=48, chars=['hexdigits']) | lower),
          'POSTGRES_APP_PASSWORD': meglevo.POSTGRES_APP_PASSWORD
            | default(lookup('ansible.builtin.password', '/dev/null', length=48, chars=['hexdigits']) | lower)
        }
      }}
