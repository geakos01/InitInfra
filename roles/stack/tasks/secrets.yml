---
# A titkok a GEPEN keletkeznek, es sosem kerulnek a repoba.
#
# Az idempotencia kulcsa: ha minden futasnal ujragenerálnank a jelszavakat, a
# mar letezo adatbazis elerhetetlenne valna. Az ansible.builtin.password lookup
# pontosan ezt oldja meg: ha a megadott fajl letezik, VISSZAOLVASSA belole a
# jelszot; ha nem, general egyet es kiirja.
#
# (Az elso valtozat a .env visszaolvasasaval probalkozott Jinja-szuroken
# keresztul. Nem mukodott: a YAML behajtogatott blokkjaban a '\n' nem ujsor,
# hanem ket karakter, ezert a split nem darabolt semmit - es a jelszavak
# minden futasnal ujra keletkeztek.)
#
# FIGYELEM: a lookup a VEZERLO gepen fut. Pull modellben ez ugyanaz a gep,
# de NEM root-kent, hanem az ansible-t futtato felhasznalokent - ezert kell a
# konyvtarat elore letrehozni, az o tulajdonaban.

- name: A titkok konyvtara
  ansible.builtin.file:
    path: "{{ stack_dir }}/.secrets"
    state: directory
    owner: "{{ docker_users | first }}"
    group: "{{ docker_users | first }}"
    mode: "0700"

# Hex, mert a base64 "/", "+" es "=" karakterei elszallnanak a psql
# string-literaljaban es a compose ${...} interpolaciojaban is.
- name: Jelszavak eloallitasa vagy visszaolvasasa
  ansible.builtin.set_fact:
    titkok:
      POSTGRES_AIRFLOW_PASSWORD: >-
        {{ lookup('ansible.builtin.password',
                  stack_dir ~ '/.secrets/pg_airflow', length=48, chars=['hexdigits']) }}
      POSTGRES_APP_PASSWORD: >-
        {{ lookup('ansible.builtin.password',
                  stack_dir ~ '/.secrets/pg_app', length=48, chars=['hexdigits']) }}
  no_log: true

# A Fernet kulcs NEM lehet akarmilyen veletlen sztring: pontosan 32 bajt,
# url-safe base64-ben. Ezert nem a password lookup general ja, hanem a
# cryptography konyvtar. A "creates:" teszi idempotensse - ha a fajl mar
# megvan, a parancs le sem fut.
#
# become: false, mert a fajlt az ansible-t futtato felhasznalonak kell tudnia
# visszaolvasni a lookup('file')-lal - az is az o neveben fut.
- name: Airflow Fernet kulcs eloallitasa
  ansible.builtin.shell:
    cmd: >-
      umask 077 &&
      python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      > {{ stack_dir }}/.secrets/fernet
    creates: "{{ stack_dir }}/.secrets/fernet"
  become: false

- name: Airflow titkok hozzaadasa
  ansible.builtin.set_fact:
    titkok: >-
      {{ titkok | combine({
        'AIRFLOW_FERNET_KEY': lookup('ansible.builtin.file', stack_dir ~ '/.secrets/fernet') | trim,
        'AIRFLOW_JWT_SECRET': lookup('ansible.builtin.password',
            stack_dir ~ '/.secrets/airflow_jwt', length=64, chars=['hexdigits']),
        'AIRFLOW_ADMIN_PASSWORD': lookup('ansible.builtin.password',
            stack_dir ~ '/.secrets/airflow_admin', length=24, chars=['hexdigits']),
        'GRAFANA_ADMIN_PASSWORD': lookup('ansible.builtin.password',
            stack_dir ~ '/.secrets/grafana_admin', length=24, chars=['hexdigits']),
        'JUPYTER_TOKEN': lookup('ansible.builtin.password',
            stack_dir ~ '/.secrets/jupyter', length=48, chars=['hexdigits'])
      }) }}
  no_log: true

# A lookup a VEZERLO gepen fut, tehat az ansible-t indito felhasznalo neveben.
# Ez a bootstrap.sh eseten root, kesobb kezzel viszont tipikusan ubuntu - es
# egy root-kent letrehozott 0600-as fajlt az ubuntu mar nem tudna
# visszaolvasni: a kovetkezo futas "Permission denied"-del allna meg.
#
# Ezert minden futas vegen egysegesitjuk a tulajdonost. Igy mindegy, milyen
# sorrendben fut a ketto - a titkok mindig olvashatok maradnak.
- name: A titkok listaja
  ansible.builtin.find:
    paths: "{{ stack_dir }}/.secrets"
    file_type: file
  register: titok_fajlok

- name: A titkok tulajdonosa es jogai
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ docker_users | first }}"
    group: "{{ docker_users | first }}"
    mode: "0600"
  loop: "{{ titok_fajlok.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
