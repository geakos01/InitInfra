---
# --- Verziok. Minden pinnelve, "latest" sehol. -----------------------------
postgres_image: postgres:16
redis_image: redis:7.2

# --- Adatbazisok -----------------------------------------------------------
pg_airflow_db: airflow
pg_airflow_user: airflow
pg_app_db: app
pg_app_user: app

# --- Redis -----------------------------------------------------------------
# Szandekosan nincs perzisztencia: a session historyt a Python ujraepiti a
# Postgresbol. Ezert save "", appendonly no, es allkeys-lru.
redis_maxmemory: 512mb

# --- Eroforras-korlatok ----------------------------------------------------
# A dev VM 8 GB, az eles gep akar 32 GB. NE drotozd be.
scheduler_mem_limit: 3g

# --- Az app image ----------------------------------------------------------
# Ebbol fut az Airflow negy komponense, a Jupyter es a FastAPI vegpont is:
# egyetlen Python-kornyezet a gepen.
app_image: initinfra/app:dev
airflow_base_image: apache/airflow:3.3.1-python3.12
torch_version: 2.9.0

# --- Airflow ---------------------------------------------------------------
airflow_uid: 50000
airflow_admin_user: admin
airflow_web_port: 8080

# --- Observability ---------------------------------------------------------
prometheus_image: prom/prometheus:v3.5.5
grafana_image: grafana/grafana:13.1.4
node_exporter_image: prom/node-exporter:v1.12.1
# FIGYELEM: a cadvisor gcr.io-rol GHCR.IO-ra koltozott. A gcr.io alatt a
# legfrissebb v0.52.1, es a tervben szereplo v0.60.5 SEHOL nem letezik.
cadvisor_image: ghcr.io/google/cadvisor:v0.57.0
postgres_exporter_image: prometheuscommunity/postgres-exporter:v0.20.1
redis_exporter_image: oliver006/redis_exporter:v1.89.0
statsd_exporter_image: prom/statsd-exporter:v0.29.0

prometheus_retention: 30d
prometheus_port: 9090
grafana_port: 3000
cadvisor_port: 8081
grafana_admin_user: admin
