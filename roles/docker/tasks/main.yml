---
# A manual-install.md 2. szakasza. A hivatalos Docker repobol telepitunk,
# NEM az Ubuntu docker.io csomagjabol: az regebbi, es a compose plugin sem jar vele.

- name: Keyring konyvtar
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [docker]

- name: Docker GPG kulcs
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  tags: [docker]

- name: Docker apt repo
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true
  tags: [docker]

- name: Docker csomagok
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  tags: [docker]

- name: Docker szolgaltatas
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  tags: [docker]

# A csoporttagsag csak UJ munkamenetben el. Az Ansible sajat taskjai become-mal
# root-kent futnak, oket ez nem erinti - de a felhasznalo kovetkezo SSH
# bejelentkezesekor lesz ervenyes.
- name: Felhasznalok a docker csoportba
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  tags: [docker]

# --- A Docker/ufw utkozes kezelese ------------------------------------------
# A Docker kozvetlenul az iptables FORWARD lancaba ir, az ufw szabalyai ELE.
# Ezert egy publikalt kontener-port kivulrol elerheto marad, hiaba tiltja az ufw.
# Meres es reszletek: docs/manual-install.md 4. szakasz.
- name: DOCKER-USER blokk az ufw after.rules-ban
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} INITINFRA DOCKER-USER"
    block: "{{ lookup('template', 'docker-user.rules.j2') }}"
    create: false
    owner: root
    group: root
    mode: "0640"
  notify: ufw ujratoltese
  tags: [docker, ufw]
