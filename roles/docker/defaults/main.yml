---
# A DOCKER-USER lancba kerulo szabalyok. Minden elem egy port es a hozza
# tartozo engedelyezett IP-k:
#
#   docker_user_rules:
#     - port: 3000
#       allowed_ips: [1.2.3.4]
#
# Ures listaval is KIRENDERELJUK a blokkot - lasd a sablon megjegyzeset.
# A tenyleges erteket a group_vars/all.yml szamolja ki a publish_web_ui,
# az allowed_ips es az api_allowed_ips alapjan.
docker_user_rules: []
