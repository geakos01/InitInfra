# Az InitInfra PULL modellben fut: a playbook a CELGEPEN indul, nem tavolrol.
# Ezert nincs remote_user, ssh beallitas, vagy inventory-halozat.
[defaults]
inventory        = inventory/hosts.yml
roles_path       = roles
stdout_callback  = yaml
# A "changed" es "ok" kulonbsege itt a lenyeg: a masodik futasnak csupa "ok"-ot
# kell irnia. Ehhez latni kell, mi valtozott es miert.
display_skipped_hosts = false

[privilege_escalation]
become        = true
become_method = sudo
