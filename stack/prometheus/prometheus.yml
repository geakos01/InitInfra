# A Prometheus HUZ, nem kap. Minden exporter innen van megszolitva.
# Egyetlen kivetel az Airflow, ami TOL: statsd-n (UDP 9125) kuldi a metrikait
# a statsd-exporternek, amit aztan a Prometheus mar huzhat a 9102-rol.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node                     # a gep maga: CPU, RAM, lemez, halozat
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor                 # kontenerenkenti eroforras-hasznalat
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: airflow                  # a statsd-exporter forditja Prometheus-formara
    static_configs:
      - targets: ['statsd-exporter:9102']
