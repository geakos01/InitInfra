name: initinfra

# ---------------------------------------------------------------------------
# Airflow 3.3.1, LocalExecutor
#
# A hivatalos compose fajlbol indul, de:
#   - CeleryExecutor -> LocalExecutor
#   - a "worker" es a "flower" service kimarad (azok Celery-specifikusak)
#   - a "redis" NEM broker: az a mi alkalmazasunke, az Airflow nem is latja
#   - a titkok a /opt/stack/.env-bol jonnek, a gepen generalva
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  image: initinfra/app:dev
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    # A 3.x-ben a taskok a Task Execution API-n keresztul beszelnek, nem a DB-vel
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Az EGYETLEN push-út a rendszerben: az Airflow maga kuldi a metrikait
    # UDP-n a statsd-exporternek. Minden mas metrikat a Prometheus HUZ.
    AIRFLOW__METRICS__STATSD_ON: 'true'
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: '9125'
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # A modellkodnak atadott kapcsolati adatok. Az Airflow ezeket nem hasznalja,
    # de a DAG-ok es a taskok innen tudjak, hova csatlakozzanak.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: '5432'
    POSTGRES_APP_DB: ${POSTGRES_APP_DB}
    POSTGRES_APP_USER: ${POSTGRES_APP_USER}
    POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: '6379'
  volumes:
    # A DAG-ok a modellkodbol jonnek (/opt/app), amit git pull frissit
    - /opt/app/dags:/opt/airflow/dags
    # A task-logok kulon named volume-ban, nem a kod mellett
    - airflow-logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy


services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Az Airflow metadata DB-je - ezt a postgres image maga hozza letre
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      # Az alkalmazas DB-jet az initdb szkript hozza letre, ezekbol
      APP_DB: ${POSTGRES_APP_DB}
      APP_USER: ${POSTGRES_APP_USER}
      APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Alapertelmezesben loopback: kifele a Docker sem publikalja
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_AIRFLOW_USER} -d $${POSTGRES_AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2
    restart: unless-stopped
    # Szandekosan nincs perzisztencia: a session historyt a Python
    # ujraepiti a Postgresbol. Ezert save "" es appendonly no.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY}
      - --maxmemory-policy
      - allkeys-lru
    # A redis image VOLUME /data-t deklaral, ezert minden ujralétrehozasnal
    # keletkezne egy nevtelen volume. tmpfs-sel nincs mit felejteni, es nem szemetel.
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Egyszer fut le: DB migracio + admin user. A tobbi service ezt megvarja.
  # Az entrypoint dolgozza fel a _AIRFLOW_DB_MIGRATE / _AIRFLOW_WWW_USER_CREATE
  # valtozokat - ezert hivjuk meg explicit a "/entrypoint airflow version"-t.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,plugins,config}
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    user: "0:0"
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    # A taskok a scheduler gyerekfolyamatai (LocalExecutor). A limit azert kell,
    # hogy egy elszallo trening ne vigye el a gep egesz memoriajat: a cgroup
    # OOM killer a legnagyobb folyamatot lovi ki, azaz a treninget, nem a schedulert.
    mem_limit: ${SCHEDULER_MEM_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # ---------------- Observability ----------------
  # A Prometheus huz, minden exporter passzivan var. Egyetlen push-út van:
  # Airflow -> statsd-exporter (UDP 9125). A Grafananak egyetlen adatforrasa
  # van, a Prometheus.

  prometheus:
    image: prom/prometheus:v3.5.5
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:13.1.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    # A hoston fut, hogy a gep valodi allapotat lassa, ne a kontenerét
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"

  cadvisor:
    # A projekt regisztratumot valtott: gcr.io -> ghcr.io
    image: ghcr.io/google/cadvisor:v0.57.0
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # A cadvisor belul 8080-on figyel - ugyanazon a porton, mint az Airflow.
    # Kontenerenkent kulon halozati nevter van, tehat belul nincs utkozes;
    # kifele viszont 8081-re publikaljuk.
    ports:
      - "127.0.0.1:8081:8080"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DB}?sslmode=disable"
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy

  statsd-exporter:
    image: prom/statsd-exporter:v0.29.0
    restart: unless-stopped
    command:
      - --statsd.mapping-config=/etc/statsd/mapping.yml
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
    volumes:
      - ./prometheus/statsd-mapping.yml:/etc/statsd/mapping.yml:ro
    expose:
      - "9102"
      - "9125/udp"

  # ---------------- Jupyter ----------------
  # UGYANABBOL az app image-bol fut, mint az Airflow: a notebookok pontosan
  # azokat a konyvtarakat es verziokat latjak, mint a DAG-ok. Nincs kulon venv,
  # amit karban kellene tartani.
  jupyter:
    image: initinfra/app:dev
    restart: unless-stopped
    # Az airflow image entrypointja MINDEN parancsot az airflow CLI-nek ad tovabb
    # ("jupyter --version" az airflow sugojat irja ki), ezert felul kell irni.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        jupyter lab
        --ip=0.0.0.0 --port=8888 --no-browser
        --IdentityProvider.token="${JUPYTER_TOKEN}"
        --ServerApp.root_dir=/opt/notebooks
    environment:
      <<: *airflow-common-env
      # A modellkod importalhato legyen a notebookokbol
      PYTHONPATH: /opt/app
    volumes:
      # A modellkod CSAK OLVASHATO. Ez nem korlatozas, hanem vedelem: a /opt/app
      # git-kezelt, es a kovetkezo "git pull" utkozne barmivel, amit ide mentenenk.
      - /opt/app:/opt/app:ro
      # A notebookok kulon, irhato helyen. Named volume, hogy a tulajdonost a
      # Docker intezze - bind mount eseten az UID 50000 vs 1000 elteres miatt
      # nem tudna irni.
      - notebooks:/opt/notebooks
      # FIGYELEM: a /home/airflow-ra NEM mountolunk semmit! A pip oda telepitett
      # (/home/airflow/.local/lib/python3.12/site-packages), egy volume eltuntetne
      # a torch-ot es minden mast. Csak az .jupyter alkonyvtarat perzisztaljuk.
      - jupyter-config:/home/airflow/.jupyter
    working_dir: /opt/notebooks
    user: "${AIRFLOW_UID}:0"
    ports:
      # A Jupyter teljes koru kodfuttatas. Ezt SOHA ne tedd ki szelesebb korben,
      # mint a sajat cimed - a 9. dontes ezt kifejezetten rogziti.
      - "127.0.0.1:8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/api || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  airflow-logs:
  prometheus-data:
  grafana-data:
  jupyter-config:
  notebooks:
