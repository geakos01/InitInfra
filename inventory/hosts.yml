# A telepito a celgepen fut, sajat magara. Ez az inventory csak azert letezik,
# hogy a group_vars/all.yml betoltodjon - a playbookot mindig igy hivjuk:
#   ansible-playbook -i localhost, -c local site.yml
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: /usr/bin/python3
