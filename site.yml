---
# Az InitInfra fo playbookja. PULL modellben fut: a CELGEPEN inditod,
# nem tavolrol. A hivas mindig:
#
#   ansible-playbook -i localhost, -c local site.yml
#
# vagy egyszerubben: make dev
- name: InitInfra - futtatokornyezet felepitese
  hosts: all
  become: true
  roles:
    - role: base
      tags: [base]
    - role: docker
      tags: [docker]
    - role: stack
      tags: [stack]

    # A "never" cimke miatt ez a szerepkor a "make dev"-ben NEM fut le - csak
    # akkor, ha kifejezetten kered: make verify. Igy az epites es az
    # ellenorzes ugyanabbol a valtozokeszletbol dolgozik (ugyanazok a portok,
    # ugyanazok az adatbazisnevek), de kulon parancs inditja oket.
    - role: verify
      tags: [never, verify]
