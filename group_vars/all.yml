# ---------------------------------------------------------------------------
# Alapertelmezesek MINDEN gepre.
#
# Gepenkent eltero ertekeket NE ide irj, hanem egy group_vars/<gep>.yml-be.
# Ez a fajl az, ami minden ugyfelnel ugyanaz - a szemelyre szabas a masik.
# ---------------------------------------------------------------------------

# --- Gep-higienia -----------------------------------------------------------
timezone: Europe/Budapest

# A dev VM 8 GB RAM-os, az eles gep akar 32 GB. A swap ne legyen bedrotozva.
swap_size_mb: 4096
# 10 = csak akkor swapelj, ha tenyleg muszaj. Adatbazist futtato gepen nem
# akarjuk, hogy a kernel kedvtelesbol lapozzon ki memoriat.
swappiness: 10

# Az apt IPv4-en toltson. Friss VM-en belefutottunk abba, hogy a gepen az IPv6
# hirdetve van, de nem mukodik (curl -6 azonnal elhasal, curl -4 megy). Ilyenkor
# az apt ora hosszat "fut" nulla CPU-idovel. Ha a celgepen mukodo IPv6 van,
# nyugodtan allitsd false-ra.
apt_force_ipv4: true

# --- SSH es tuzfal ----------------------------------------------------------
ssh_port: 22
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5

# --- Docker -----------------------------------------------------------------
docker_users:
  - ubuntu

# --- Publikalas -------------------------------------------------------------
# Alapertelmezesben MINDEN admin felulet loopbackon van, SSH tunnelen kereszul
# erheto el. A publikalas gepenkenti kapcsolo.
#
# FIGYELEM: a Docker megkeruli az ufw-t (lasd docs/manual-install.md 4. szakasz).
# Az allowed_ips ezert NEM ufw szabalyokat general, hanem DOCKER-USER lancot.
publish_web_ui: false
allowed_ips: []

# --- A FastAPI vegpont ------------------------------------------------------
# Ez a stack egyetlen eleme, ami valoban kifele nez. A KODJA nem az InitInfra
# resze: a /opt/app-bol jon, ugyfelenkent mas.
api_enabled: true
api_port: 8000
api_command: "uvicorn logger_api.app:app --host 0.0.0.0 --port 8000"
# Ures lista = a vilag fele nyitva. Ha az ugyfel backendje hivja, ide az o IP-je jon.
api_allowed_ips: []

# --- Utvonalak (ezeket ritkan kell atirni) ----------------------------------
stack_dir: /opt/stack
app_dir: /opt/app
initinfra_dir: /opt/initinfra

# --- A DOCKER-USER lanc szabalyai -------------------------------------------
# Ebbol generalja a docker szerepkor az /etc/ufw/after.rules blokkjat.
#
# FONTOS: ez NEM ufw szabaly. A Docker kozvetlenul az iptables FORWARD lancaba
# ir, az ufw ele - egy publikalt kontener-port ezert ufw-vel nem szurheto.
# Meres es reszletek: docs/manual-install.md 4. szakasz.
#
# Ures lista eseten is kirendereljuk a blokkot, mert a ":DOCKER-USER - [0:0]"
# sor az, ami ufw reload-kor NULLAZZA a lancot. Enelkul a korabbi szabalyok
# bennragadnanak, es a kikapcsolas nem mukodne.
docker_user_rules: >-
  {{
    (
      [{'port': api_port, 'allowed_ips': api_allowed_ips}]
      if (api_enabled and api_allowed_ips | length > 0) else []
    )
    +
    (
      [{'port': airflow_web_port, 'allowed_ips': allowed_ips},
       {'port': grafana_port,     'allowed_ips': allowed_ips},
       {'port': prometheus_port,  'allowed_ips': allowed_ips},
       {'port': jupyter_port,     'allowed_ips': allowed_ips}]
      if (publish_web_ui and allowed_ips | length > 0) else []
    )
  }}
